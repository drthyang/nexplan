name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The pinned sources (sha256-checked), before the tests: the TOPAZ detector and UB tests read the Mantid IDF and .mat files.
      - run: npm run data:fetch
      - run: npm test
      # Copied MATERIA modules must be byte-identical to the pinned upstream commit.
      - run: npm run materia:check
      # Generated tables must match what the pinned sources produce.
      - run: npm run data:check
      - run: npm run build
